<style>

*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink)}

.counts b{padding:2px 8px;border-radius:6px}
.n{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}.l{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.r{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
button.g,button.show,button.ghost{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 6px;border-radius:10px;cursor:pointer}
button.g small{display:block;color:var(--mute);font-size:12px;margin-top:2px}

button.show{width:100%;margin-top:14px;background:var(--acc);color:var(--on);border:0;font-size:16px;padding:14px}
.g1{border-color:var(--bad)!important}.g2{border-color:var(--warn)!important}.g3{border-color:var(--ok)!important}.g4{border-color:var(--acc)!important}
.sp{border:0;background:none;font-size:22px;cursor:pointer}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ok)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}

input[type=search]{width:100%;margin-bottom:10px}

.card{position:relative}

 details .row:has(select),details .row:has(input:not([type=checkbox]):not([type=radio])){flex-direction:column;align-items:stretch;gap:4px}

/* ---- Einstellungen: Akkordeon ---- */
details.box{padding:0;overflow:hidden}

.st{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 14px}

/* --- sanftere Animationen --- */
:root{interpolate-size:allow-keywords}
details.box::details-content{block-size:0;overflow:clip;transition:block-size .38s cubic-bezier(.2,.8,.2,1),content-visibility .38s allow-discrete}

details.box>.in{animation:dn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes dn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
main{animation:vin .5s cubic-bezier(.2,.8,.2,1) both}

 {let ow=-1;

  const clean=v=>String(v||'').replace(/\|/g,' ').replace(/\s+/g,' ').trim();
  const owCat=()=>{const i=cats.indexOf(OWN);const cb=document.querySelector('[data-cat="'+i+'"]');if(cb)cb.checked=!T.off.includes(OWN);const c=$('owcnt');if(c)c.textContent=CARDS.filter(x=>x.cat===OWN).length;const sb=$('sub-own');if(sb)sb.textContent=(S.own||[]).length+' eigene Karten · Kategorie „'+OWN+'“'};
  const owReset=()=>{ow=-1;$('ow-en').value='';$('ow-de').value='';$('ow-ex').value='';$('ow-add').textContent='Hinzufügen';$('ow-cancel').style.display='none'};
  const owList=()=>{const L=S.own||[];
   $('ownlist').innerHTML=L.length?`<div class="hint" style="text-align:left;margin:10px 0 4px">${L.length} eigene ${L.length===1?'Karte':'Karten'}</div><table>`+L.map((l,i)=>{const o=owp(l);return `<tr><td><b>${esc(o.en)}</b></td><td>${esc(o.de)}</td><td style="white-space:nowrap;text-align:right"><button class="lnk" data-oe="${i}">Ändern</button> <button class="lnk" data-od="${i}" style="color:var(--bad)">Löschen</button></td></tr>`}).join('')+'</table>':'<div class="hint" style="text-align:left;margin:10px 0 0">Noch keine eigenen Wörter.</div>';
   document.querySelectorAll('[data-oe]').forEach(b=>b.onclick=()=>{const i=+b.dataset.oe,o=owp(S.own[i]);ow=i;$('ow-en').value=o.en;$('ow-de').value=o.de;$('ow-ex').value=o.ex;$('ow-add').textContent='Änderung speichern';$('ow-cancel').style.display='';$('ow-en').focus()});
   document.querySelectorAll('[data-od]').forEach(b=>b.onclick=()=>{const i=+b.dataset.od,o=owp(S.own[i]);if(!confirm('„'+o.en+'“ löschen? Der Lernfortschritt dieser Karte geht verloren.'))return;
    const id=o.en.toLowerCase();const k=CARDS.findIndex(x=>x.id===id&&x.cat===OWN);if(k>=0)CARDS.splice(k,1);delete S.cards[id];S.own.splice(i,1);if(ow===i)owReset();else if(ow>i)ow--;save();toast('Gelöscht');owList();owCat()});
   owCat()};
  $('ow-add').onclick=()=>{const en=clean($('ow-en').value),de=clean($('ow-de').value),ex=clean($('ow-ex').value);
   if(!en||!de){toast('Bitte Englisch und Deutsch ausfüllen');return}
   const id=en.toLowerCase();S.own=S.own||[];const line=[en,de,ex].join('|');
   if(ow>=0){const old=owp(S.own[ow]),oid=old.en.toLowerCase();
    if(id!==oid&&CARDS.some(x=>x.id===id)){toast('„'+en+'“ gibt es schon');return}
    const card=CARDS.find(x=>x.id===oid&&x.cat===OWN);S.own[ow]=line;
    if(card){card.id=id;card.en=en.replace(/([a-z])\d+(?=\s*\(|$)/i,'$1');card.de=de;card.ex=ex}
    if(id!==oid&&S.cards[oid]){S.cards[id]=S.cards[oid];delete S.cards[oid]}
    save();toast('✓ Änderung gespeichert');owReset();owList();return}
   if(CARDS.some(x=>x.id===id)){const ex0=CARDS.find(x=>x.id===id);toast(ex0.cat===OWN?'„'+en+'“ hast du schon angelegt':'„'+en+'“ ist schon in den Oxford-Listen')
    return}
   S.own.push(line);addCard(en,de,ex,OWN);const was=T.off.includes(OWN);T.off=T.off.filter(x=>x!==OWN);save();
   toast(was?'✓ Hinzugefügt · Kategorie aktiviert':'✓ Hinzugefügt');$('ow-en').value='';$('ow-de').value='';$('ow-ex').value='';$('ow-en').focus();owList()};
  $('ow-cancel').onclick=()=>owReset();
  ['ow-en','ow-de','ow-ex'].forEach(k=>$(k).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(k==='ow-en')$('ow-de').focus();else if(k==='ow-de')$('ow-ex').focus();else $('ow-add').onclick()}});
  owList()}
 $('done').onclick=()=>go('learn');
 $('sexp').onclick=()=>{const L=[];for(const id in (S.sent||{}))S.sent[id].forEach(s=>L.push(id+' | '+s.t));if(!L.length){toast('Noch keine Sätze');return}const b=new Blob([L.join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meine-saetze-'+today()+'.txt';a.click()};
 $('sclr').onclick=()=>{if(confirm('Alle gespeicherten Sätze löschen?')){S.sent={};save();rSet()}};
 $('upd').onclick=async()=>{try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}}catch(e){}location.reload()}}

load();
(S.own||[]).forEach(l=>{const p=l.split('|');addCard(p[0],p[1],p[2],OWN)});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>
</body>
</html>
